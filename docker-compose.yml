services:
  # Slim mailer runtime image
  bq-mailer-build:
    build:
      context: .
      dockerfile: ./docker/mailer/Dockerfile.prod
    image: blockqueue/mailer:latest

  # Production-like consumer: compiles examples/mail-service templates into the slim runtime
  # Usage: docker compose build bq-mailer-build && docker compose up bq-example-mail-service
  bq-example-mail-service:
    build:
      context: ./examples/mail-service
      dockerfile: Dockerfile
      args:
        MAILER_IMAGE: blockqueue/mailer:latest
    image: blockqueue/example-mail-service:latest
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info

      # user defined variables based on config.yaml
      - MAILER_SIGNING_SECRET=wefeqfdwfwrfqfweq9343rrwfeafeqr42r432ef
      - MAIL_FROM_EMAIL=noreply@example.com
      - ZEPTOMAIL_API_KEY=your-api-key
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=your-access-key-id
      - AWS_SECRET_ACCESS_KEY=your-secret-access-key
