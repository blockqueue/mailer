<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to {{appName}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
        sans-serif;
      color: #18181b;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  background-color: #18181b;
                  padding: 24px 32px;
                  color: #ffffff;
                  font-size: 18px;
                  font-weight: 600;
                  letter-spacing: -0.02em;
                "
              >
                {{appName}}
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <h1
                  style="
                    margin: 0 0 12px;
                    font-size: 24px;
                    font-weight: 600;
                    line-height: 1.3;
                  "
                >
                  Welcome, {{userName}}
                </h1>
                <p
                  style="
                    margin: 0 0 16px;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #3f3f46;
                  "
                >
                  Your account is ready. You can sign in and start using
                  {{appName}} right away.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #3f3f46;
                  "
                >
                  If you did not create this account, you can ignore this email.
                </p>
                <p style="margin: 0; font-size: 14px; color: #71717a">
                  Need help? Contact
                  <a
                    href="mailto:{{supportEmail}}"
                    style="color: #2563eb; text-decoration: none"
                  >{{supportEmail}}</a>.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 32px 28px;
                  border-top: 1px solid #e4e4e7;
                  font-size: 12px;
                  line-height: 1.5;
                  color: #a1a1aa;
                "
              >
                You received this email because an account was created on
                {{appName}}.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
